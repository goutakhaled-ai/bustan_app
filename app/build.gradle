plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.bustanalhuruf'
    compileSdk 35

    defaultConfig {
        applicationId 'com.personal.bustanalhuruf'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('bustan.jks')
            storePassword 'bustan2026'
            keyAlias 'bustan'
            keyPassword 'bustan2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
