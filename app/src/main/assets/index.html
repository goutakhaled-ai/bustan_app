<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6C4BD8">
<title>بستان الحروف</title>
<style>
:root{--p:#6C4BD8;--p2:#9A7BFF;--ink:#2B2340;--mut:#7A7290;--ok:#2DBE7E;--bad:#FF5E6C;--y:#FFC93C;--o:#FF9F45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;background:#FFF6E6;color:var(--ink);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.ar{font-family:'Noto Naskh Arabic','Amiri','Scheherazade New','Traditional Arabic','Times New Roman',serif}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.4}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg svg{width:100%;height:100%}
.cl{animation:drift 26s ease-in-out infinite alternate}
.cl2{animation:drift 34s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(22px)}}
.tw{animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
.bl{animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.sunr{transform-origin:62px 70px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 14px;background:linear-gradient(135deg,#6C4BD8,#9A7BFF 70%,#B98CFF);color:#fff;border-radius:0 0 26px 26px;box-shadow:0 6px 18px rgba(80,50,180,.28)}
header h1{flex:1;margin:0;font-size:19px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:42px;height:42px;border-radius:15px;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:20px;display:grid;place-items:center}
.starpill{background:#fff;color:var(--p);border-radius:20px;padding:6px 11px;font-weight:800;font-size:15px;white-space:nowrap}
main{position:relative;z-index:1;padding:14px;max-width:760px;margin:0 auto;padding-bottom:60px}
h2,h3{margin:4px 0 12px}
h3{font-size:17px;color:var(--p)}
.mut{color:var(--mut)}
.center{text-align:center}
.card{background:rgba(255,255,255,.94);border-radius:24px;padding:16px;box-shadow:0 6px 0 rgba(108,75,216,.08),0 8px 22px rgba(60,40,120,.08);margin-bottom:14px}
.sec{display:flex;align-items:center;gap:8px;margin:20px 4px 10px;font-size:19px;font-weight:800;color:var(--ink)}
.sec::after{content:'';flex:1;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,#E3D9FF 0 10px,transparent 10px 16px)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.tile{position:relative;overflow:hidden;border:0;border-radius:24px;padding:14px 4px 12px;color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.16);display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.3}
.tile::before{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18);top:-34px;left:-30px}
.tile::after{content:'';position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);bottom:-16px;right:-10px}
.tile:active,.btn:active,.opt:active,.tl:active,.rb:active{transform:translateY(3px)}
.tile .ic{position:relative;z-index:1;font-size:32px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;line-height:1}
.tile span,.tile small{position:relative;z-index:1}
.tile small{font-weight:500;font-size:12px}
.btn{border:0;border-radius:18px;padding:12px 20px;background:var(--p);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18);margin:4px}
.btn.ghost{background:#EFEAFF;color:var(--p);box-shadow:0 4px 0 #D9CEFF}
.btn.ok{background:var(--ok)}
.btn.red{background:var(--bad)}
.btn.or{background:linear-gradient(135deg,var(--o),#FFB45C)}
.btn.big{font-size:20px;padding:14px 28px}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:8px 0}
.mini{border:0;background:#EFEAFF;color:var(--p);border-radius:14px;padding:6px 12px;font-size:18px}
.hello{display:flex;align-items:center;gap:14px}
.av{font-size:48px;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF7D6,#FFE08A);display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 0 #F2C94C}
.hi{font-size:22px;font-weight:800}
.chipline{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{background:#F3EEFF;color:var(--p);border-radius:20px;padding:3px 10px;font-size:13px;font-weight:700}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px;color:#fff;background:linear-gradient(135deg,#FF8A5B,#FF6FA3 60%,#C46BFF);box-shadow:0 6px 0 #D9547F;margin-bottom:14px}
.hero::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.15);left:-50px;top:-60px}
.hero h2{margin:0 0 4px;font-size:22px;position:relative}
.hero p{margin:0 0 10px;position:relative}
.hero .bar{background:rgba(255,255,255,.3)}
.hero .bar i{background:#fff}
.hero .btn{background:#fff;color:#E2557F;position:relative}
.plants{font-size:30px;letter-spacing:2px;min-height:40px;line-height:1.4}
.plants .mut{font-size:15px;letter-spacing:0}
.bar{height:12px;background:#F1ECFF;border-radius:10px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--o));border-radius:10px}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lb{position:relative;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #E6DEFF;font-size:40px;padding:8px 0 4px;color:var(--ink)}
.lb small{display:block;font-size:12px;color:var(--mut);font-family:Tahoma,sans-serif}
.lb.done{background:#E9FBF2;box-shadow:0 4px 0 #BDEFD6}
.lb.done::after{content:'✓';position:absolute;top:4px;left:8px;font-size:14px;color:var(--ok);font-weight:900}
.bigletter{font-size:150px;line-height:1.25;color:var(--p);text-shadow:0 6px 0 #E6DEFF}
.lname{font-size:30px;margin-bottom:6px}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.form{background:#F7F4FF;border-radius:16px;padding:6px 2px;text-align:center}
.form div{font-size:46px;line-height:1.4}
.form small{color:var(--mut);font-size:12px}
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wcard{border:0;background:#FFF6E0;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #F6E2B3;color:var(--ink)}
.wcard .em{font-size:44px}
.wcard .ar{font-size:24px}
.tracewrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:6px auto;background:#fff;border:3px dashed #D9CEFF;border-radius:22px;overflow:hidden}
.tracewrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chip{flex-shrink:0;border:0;min-width:52px;height:52px;padding:0 10px;border-radius:16px;background:#fff;box-shadow:0 3px 0 #E6DEFF;font-size:26px;color:var(--ink)}
.chip.on{background:var(--p);color:#fff;box-shadow:0 3px 0 #4A2FB0}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hgrid.three{grid-template-columns:repeat(3,1fr)}
.hb{border:0;border-radius:18px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;color:var(--ink);transition:transform .2s}
.hb .ar{font-size:44px;line-height:1.5}
.hb small{font-size:12px;color:var(--mut)}
.c0{background:#FFE3EF}.c1{background:#E2F2FF}.c2{background:#E4F8EE}.c3{background:#FFF1D6}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rc{border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #E6DEFF;padding:10px 2px;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.rc .em{font-size:38px}.rc .ar{font-size:22px}
.rc.done{background:#E9FBF2;box-shadow:0 4px 0 #BDEFD6}
.huge{font-size:80px;line-height:1.2}
.rword{font-size:60px;line-height:1.5;color:var(--p);border-radius:18px;transition:all .3s;padding:0 10px;display:inline-block}
.rword.on{background:#FFF1C9;transform:scale(1.08)}
.syl,.units{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.sy{border:0;border-radius:18px;font-size:44px;padding:4px 18px;color:var(--ink);transition:transform .2s}
.sy.on{transform:scale(1.2);box-shadow:0 0 0 4px var(--y)}
.un{border:0;border-radius:16px;background:#F7F4FF;padding:4px 10px;display:flex;flex-direction:column;align-items:center;min-width:62px;color:var(--ink)}
.un .ar{font-size:40px;line-height:1.5}.un small{font-size:12px;color:var(--mut);min-height:16px}
.prog{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.prog i{width:14px;height:14px;border-radius:50%;background:#E6DEFF}
.prog i.d{background:var(--ok)}.prog i.c{background:var(--y);transform:scale(1.2)}
.q{font-size:20px;font-weight:700;margin:4px 0 10px}
.bigplay{border:0;width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--o),var(--y));font-size:44px;box-shadow:0 6px 0 #D9822F}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.opts.one{grid-template-columns:1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{border:0;border-radius:24px;background:#fff;box-shadow:0 5px 0 #E6DEFF;font-size:66px;line-height:1.5;color:var(--ink)}
.opt.txt{font-size:20px;padding:18px 6px;font-weight:700;font-family:Tahoma,sans-serif}
.opt.wd{font-size:34px;padding:8px 4px}
.opt.wd small{display:block;font-size:30px}
.good{background:#D9F8E8!important;box-shadow:0 5px 0 #8EDDB6!important}
.wrong{background:#FFE1E4!important;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}
.em.big{font-size:90px;line-height:1.2}
.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.slot{width:54px;height:62px;border-radius:14px;background:#F1ECFF;border:2px dashed #CDBFFF;display:grid;place-items:center;font-size:36px;color:var(--p)}
.slot.f{background:#E9FBF2;border:2px solid var(--ok);color:var(--ink)}
.built{font-size:54px;min-height:80px;color:var(--p)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.tl{border:0;width:70px;height:78px;border-radius:18px;background:#fff;box-shadow:0 5px 0 #E6DEFF;font-size:42px;color:var(--ink)}
.tl.used{visibility:hidden}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{border:0;height:96px;border-radius:18px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:36px;box-shadow:0 4px 0 #4A2FB0}
.mc .front{display:none}.mc.open{background:#fff;color:var(--ink);box-shadow:0 4px 0 #E6DEFF}
.mc.open .front{display:block}.mc.open .back{display:none}
.mc .front.ar{font-size:24px}.mc .front.em{font-size:44px}
.mc.done{background:#E9FBF2!important;box-shadow:0 4px 0 #BDEFD6!important}
.bh{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}
.tgt{font-size:44px;color:var(--p);vertical-align:middle}
#sky{position:relative;height:62vh;border-radius:24px;overflow:hidden;background:linear-gradient(#BFE6FF,#E8F7FF)}
.bub{position:absolute;bottom:-90px;width:72px;height:72px;border-radius:50%;border:0;color:#fff;font-size:40px;line-height:1;display:grid;place-items:center;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12);animation:rise linear forwards}
@keyframes rise{to{transform:translateY(calc(-62vh - 110px))}}
.bub.pop{opacity:0;transition:opacity .25s}
.bub.nope{filter:grayscale(1);opacity:.4}
.story{font-size:30px;line-height:2.1;text-align:justify}
.sw{border-radius:10px;padding:0 3px;transition:background .2s}
.sw.on{background:#FFE58A}
.qq p{font-size:20px;font-weight:700;margin:12px 0 8px}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qo{border:0;border-radius:16px;background:#F3EFFF;padding:10px 16px;font-size:20px;font-family:'Noto Naskh Arabic',serif;color:var(--ink)}
.pcard{display:flex;align-items:center;gap:14px;width:100%;border:0;background:rgba(255,255,255,.95);border-radius:22px;padding:14px;box-shadow:0 4px 0 #E6DEFF;margin-bottom:12px;font-size:20px;font-weight:700;color:var(--ink);text-align:right}
.pcard .av{width:60px;height:60px;font-size:34px}
.em2{font-size:30px;min-width:60px;height:60px;border-radius:18px;background:#FFF1C9;display:grid;place-items:center;padding:0 8px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avb{border:0;font-size:32px;padding:6px 0;border-radius:14px;background:#F7F4FF}
.avb.on{background:var(--y);box-shadow:0 0 0 3px var(--o)}
input[type=text],input[type=number]{width:100%;font-size:20px;padding:12px 14px;border-radius:16px;border:2px solid #E0D7FF;font-family:inherit;outline:none;text-align:center}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat div{background:#F7F4FF;border-radius:16px;padding:10px 4px}
.stat b{display:block;font-size:24px;color:var(--p)}
.stat small{color:var(--mut)}
.chart{display:flex;align-items:flex-end;justify-content:space-between;height:120px;gap:6px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.chart i{display:block;width:70%;background:linear-gradient(var(--p2),var(--p));border-radius:8px 8px 3px 3px;min-height:3px;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid #F0ECFA;text-align:right}
.weak{display:flex;flex-wrap:wrap;gap:8px}
.weak span{background:#FFE1E4;border-radius:12px;padding:4px 12px;font-size:28px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:0;padding:10px;border-radius:14px;background:#F3EFFF;font-size:16px;color:var(--ink)}
.seg button.on{background:var(--p);color:#fff}
.diag{background:#F7F4FF;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.9}
.diag b{color:var(--p)}
.task{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#fff;border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:0 4px 0 #E6DEFF;text-align:right;color:var(--ink)}
.task .n{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#F3EEFF;flex-shrink:0}
.task b{display:block;font-size:17px}
.task small{color:var(--mut)}
.task .st{margin-inline-start:auto;font-size:26px}
.task.done{background:#E9FBF2;box-shadow:0 4px 0 #BDEFD6}
.rep{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.rb{border:0;width:74px;height:74px;border-radius:22px;background:#F3EEFF;font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #DCD0FF;color:var(--ink)}
.rb small{font-size:12px;font-weight:700;margin-top:2px}
.rb.rec{background:#FFE3EA;box-shadow:0 4px 0 #FFC2D0}
.rb.rec.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.said{background:#E9FBF2;color:var(--ok);border-radius:14px;padding:6px 12px;font-weight:800;display:inline-block;margin-top:8px}
.phr{font-size:34px;line-height:1.8;color:var(--p)}
.sun{background:#FFF0D6;color:#D97706}.moon{background:#E3EEFF;color:#2563EB}
.lset{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lset span{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:26px}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two-btn .opt{font-size:22px;font-weight:800;padding:16px 4px;font-family:Tahoma,sans-serif}
.two-btn .opt span{display:block;font-size:44px}
.ngrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.nc{border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #E6DEFF;padding:8px 2px;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.nc b{font-size:34px;color:var(--p);font-family:Tahoma,sans-serif}
.nc span{font-size:17px}
.countbox{font-size:42px;line-height:1.35;letter-spacing:4px;min-height:120px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center}
.sep{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;font-size:44px}
.sep i{font-style:normal;color:#C9BCF5;font-size:28px}
.sep span{background:#F7F4FF;border-radius:14px;padding:0 12px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:10px}
.pair button{border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #E6DEFF;padding:8px 4px;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.pair .em{font-size:36px}.pair .ar{font-size:24px}
.pair i{font-style:normal;font-size:22px;color:var(--mut)}
.ayah{font-size:30px;line-height:2.1;padding:6px 10px;border-radius:14px;transition:background .25s}
.ayah.on{background:#FFF1C9}
.ayah .num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid #D9B45A;color:#9A7420;font-size:15px;margin:0 6px;font-family:Tahoma,sans-serif;vertical-align:middle}
.basm{text-align:center;font-size:28px;color:#7A5A12;margin-bottom:6px}
.qnote{font-size:13px;color:var(--mut);text-align:center;line-height:1.7}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.badge{border:0;border-radius:22px;padding:14px 8px;background:#fff;box-shadow:0 4px 0 #E6DEFF;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);text-align:center}
.badge .em{font-size:44px}
.badge b{font-size:15px}
.badge small{color:var(--mut);font-size:12px;line-height:1.5}
.badge.lock{filter:grayscale(1);opacity:.55}
.badge.got{background:linear-gradient(160deg,#FFF7D6,#FFE7A3);box-shadow:0 4px 0 #EBC65A}
.cert{position:relative;background:#FFFDF6;border-radius:18px;padding:26px 18px;text-align:center;box-shadow:0 0 0 4px #E8C35A,0 0 0 10px #FFF3CF,0 0 0 13px #6C4BD8,0 12px 30px rgba(0,0,0,.15);margin:18px 8px}
.cert .seal{font-size:64px}
.cert h2{font-size:28px;color:#6C4BD8;margin:4px 0}
.cert .nm{font-size:34px;font-weight:800;color:#E2557F;margin:10px 0;border-bottom:3px dotted #E8C35A;display:inline-block;padding:0 16px}
.cert p{font-size:17px;line-height:1.8;margin:6px 0}
.cert .dt{color:var(--mut);font-size:14px}
.cert .corner{position:absolute;font-size:26px}
#modal{position:fixed;inset:0;z-index:95;background:rgba(30,20,60,.55);display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
#modal .card{max-width:420px;width:100%;text-align:center}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:18px;font-size:16px;z-index:99;transition:transform .3s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.fx{position:fixed;z-index:90;font-size:34px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
.result .em{font-size:90px}

function hName(u){
  if(u.includes('\u0651'))return 'شدّة';
  if(/[\u064B\u064C\u064D]/.test(u))return 'تنوين';
  if(u.includes('\u064E'))return 'فتحة';

}

/* ===== الصوت: جسر أندرويد مباشر (AndroidTTS) أو المتصفّح ===== */
const NAT=window.AndroidTTS||null;
const VS={engine:NAT?'android':('speechSynthesis' in window?'web':'none'),arabic:null,voiceName:'',err:''};
let webVoice=null,ttsSeq=0;const TTS_CB={};
window.__ttsDone=id=>{const f=TTS_CB[id];delete TTS_CB[id];if(f)f();};
async function initVoice(){
  if(VS.engine==='android'){
    for(let i=0;i<50&&!NAT.ready();i++)await wait(100);
    if(!NAT.ready()){VS.err='engine not ready';VS.arabic=false;}
    else{const a=NAT.arabic();VS.arabic=a>=0;VS.voiceName=NAT.engine();if(a<0)VS.err='lang code '+a;}
  }else if(VS.engine==='web'){
    const pv=()=>{const v=speechSynthesis.getVoices();webVoice=v.find(x=>/^ar/i.test(x.lang))||null;VS.arabic=v.length?!!webVoice:null;VS.voiceName=webVoice?webVoice.name:'';};
    pv();speechSynthesis.onvoiceschanged=pv;
  }
  if(VS.arabic===false)showVoiceHelp();
}
function say(text,rate){
  rate=rate||DB.rate||0.8;
  return new Promise(res=>{
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    setTimeout(fin,1800+text.length*350);
    if(VS.engine==='android'){const id='u'+(++ttsSeq);TTS_CB[id]=fin;try{NAT.speak(text,rate,id);}catch(e){VS.err=String(e);fin();}return;}
    if(VS.engine==='web'){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';if(webVoice)u.voice=webVoice;u.rate=rate;u.onend=fin;u.onerror=fin;
      speechSynthesis.speak(u);return;
    }
    fin();
  });
}
function hush(){try{if(VS.engine==='android')NAT.stop();else if(VS.engine==='web')speechSynthesis.cancel();}catch(e){}}
let helpShown=false;
function showVoiceHelp(){if(helpShown)return;helpShown=true;$('#modal').classList.add('show');}
function openVoiceInstall(){if(NAT){try{NAT.openInstall();}catch(e){}}else toast('افتح إعدادات الهاتف ← تحويل النصّ إلى كلام ← العربيّة');}
$('#mInstall').onclick=()=>{$('#modal').classList.remove('show');openVoiceInstall();};
$('#mClose').onclick=()=>$('#modal').classList.remove('show');

/* ملفّات صوتيّة */
let CUR_AUDIO=null;
function playUrl(url){return new Promise(res=>{stopAudio();const a=new Audio(url);CUR_AUDIO=a;a.onended=()=>res(true);a.onerror=()=>res(false);a.play().catch(()=>res(false));});}
function stopAudio(){if(CUR_AUDIO){try{CUR_AUDIO.pause();CUR_AUDIO.onended=null;CUR_AUDIO.onerror=null;}catch(e){}CUR_AUDIO=null;}}

/* الميكروفون */
let MIC=null;
async function getMic(){
  if(MIC&&MIC.active)return MIC;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('التسجيل غير متاح في هذا الجهاز');return null;}
  try{MIC=await navigator.mediaDevices.getUserMedia({audio:true});return MIC;}
  catch(e){toast('اسمح للتطبيق باستعمال الميكروفون 🎤');return null;}
}

let AC;
function tone(f,d,type='sine',v=.15,when=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+when;o.start(t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.stop(t+d);}catch(e){}}
function good(){tone(660,.15);tone(880,.25,'sine',.15,.12);burst();}
function bad(){tone(220,.25,'triangle',.12);if(navigator.vibrate)navigator.vibrate(60);}
function burst(){for(let i=0;i<8;i++){const s=document.createElement('div');s.className='fx';s.textContent=pick(['⭐','✨','🌟','💫']);s.style.left='50%';s.style.top='45%';const a=Math.random()*Math.PI*2,r=90+Math.random()*90;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000);}}

let stack=[],timers=[],runId=0;
const T=(f,ms)=>{const i=setTimeout(f,ms);timers.push(i);return i;};
const I=(f,ms)=>{const i=setInterval(f,ms);timers.push(i);return i;};
function stopAll(){timers.forEach(i=>{clearTimeout(i);clearInterval(i);});timers=[];runId++;hush();stopAudio();releaseMic();}
function setTitle(t){$('#title').textContent=t;}
function render(){stopAll();const[fn,args]=stack[stack.length-1];window.scrollTo(0,0);fn(...args);$('#backBtn').style.visibility=stack.length>1?'visible':'hidden';updateStars();}
function go(fn,...args){stack.push([fn,args]);render();}
function swap(fn,...args){stack[stack.length-1]=[fn,args];render();}
function replaceRoot(fn){stack=[[fn,[]]];render();}
function back(){if(stack.length>1){stack.pop();render();return true;}return false;}
function goHome(){if(stack.length>1){stack=[stack[0]];render();}}
window.appBack=()=>{if($('#modal').classList.contains('show')){$('#modal').classList.remove('show');return true;}return back();};

let tr={};
function initTrace(ch){
  const wrap=$('.tracewrap');wrap.innerHTML='<canvas id="cvg" width="320" height="320"></canvas><canvas id="cvd" width="320" height="320"></canvas>';
  const font='bold 220px "Noto Naskh Arabic","Amiri","Traditional Arabic",serif';
  const g=$('#cvg').getContext('2d');g.font=font;g.textAlign='center';g.textBaseline='middle';g.direction='rtl';
  g.fillStyle='#EEE8FF';g.fillText(ch,160,170);g.setLineDash([6,8]);g.lineWidth=3;g.strokeStyle='#B9A8F5';g.strokeText(ch,160,170);
  const m=document.createElement('canvas');m.width=m.height=320;const mc=m.getContext('2d');
  mc.font=font;mc.textAlign='center';mc.textBaseline='middle';mc.direction='rtl';mc.fillStyle='#000';mc.strokeStyle='#000';mc.lineWidth=28;mc.lineJoin='round';mc.fillText(ch,160,170);mc.strokeText(ch,160,170);
  tr.mask=mc.getImageData(0,0,320,320).data;
  const d=$('#cvd'),c=d.getContext('2d');c.lineWidth=20;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#6C4BD8';c.fillStyle='#6C4BD8';tr.ctx=c;
  let on=false,last=null;
  const pos=e=>{const r=d.getBoundingClientRect();return[(e.clientX-r.left)*320/r.width,(e.clientY-r.top)*320/r.height];};
  d.onpointerdown=e=>{on=true;last=pos(e);try{d.setPointerCapture(e.pointerId);}catch(_){}c.beginPath();c.arc(last[0],last[1],10,0,7);c.fill();};
  d.onpointermove=e=>{if(!on)return;const p=pos(e);c.beginPath();c.moveTo(last[0],last[1]);c.lineTo(p[0],p[1]);c.stroke();last=p;};
  d.onpointerup=d.onpointercancel=()=>on=false;
}
function checkTrace(L){
  const d=tr.ctx.getImageData(0,0,320,320).data;let m=0,both=0,dr=0,out=0;
  for(let k=3;k<d.length;k+=16){const a=tr.mask[k]>0,b=d[k]>0;if(a)m++;if(b){dr++;if(a)both++;else out++;}}
  if(dr<30){toast('اكتب الحرف أوّلاً ✍️');return;}
  const cov=both/m,o=out/dr;
  if(cov>0.4&&o<0.45){good();const p=P();markDaily('letter');if(!p.learned[L.c]){p.learned[L.c]=1;save();addStar(2);toast('أحسنت! تعلّمت حرف '+strip(L.n)+' 🎉');}else{addStar();toast('ممتاز! 👏');}say('أَحْسَنْتَ');}
  else{bad();toast(cov<=0.4?'أكمل كتابة الحرف 💪':'حاول أن تكتب فوق الحرف 💪');}
}

<script>
function progDots(r,n){let s='';for(let i=1;i<=n;i++)s+=`<i class="${i<r?'d':i===r?'c':''}"></i>`;return `<div class="prog">${s}</div>`;}
function pickLetter(){const p=P();const ws=LETTERS.map(l=>Math.max(1,1+(p.err[l.c]||0)*2-(p.ok[l.c]||0)*.3));let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<28;i++){r-=ws[i];if(r<=0)return LETTERS[i];}return LETTERS[27];}
function finish(g,score,total,extra){
  stopAll();const p=P();(p.games[g]||(p.games[g]={t:0,c:0,played:0})).played++;save();
  if(g==='review')markDaily('review');
  if(dailyGame().id===g)markDaily('game');
  const ratio=total?score/total:1;const em=ratio>=.8?'🏆':ratio>=.5?'🌟':'💪';
  app.innerHTML=`<div class="card center result"><div class="em">${em}</div><h2>${ratio>=.8?'ممتاز!':ratio>=.5?'أحسنت!':'محاولة جيّدة!'}</h2>
  <p style="font-size:20px">${extra||('النتيجة: '+score+' / '+total)}</p>
  <div class="row"><button class="btn big ok" onclick="render()">🔁 العب مرّة أخرى</button><button class="btn ghost" onclick="back()">↩️ رجوع</button></div></div>`;
  good();say(ratio>=.5?'أَحْسَنْتَ':'حَاوِلْ مَرَّةً أُخْرَى');
}
function quiz(o){
  setTitle(o.title);let round=0,score=0;
  const next=()=>{
    if(round>=o.n)return finish(o.id,score,o.n);round++;
    const Q=o.make();let tried=false,lock=false;
    app.innerHTML=`${progDots(round,o.n)}<div class="card center">${Q.head}</div><div class="opts ${Q.cls||''}">${Q.choices.map((c,k)=>`<button class="opt ${c.cls||''}" data-k="${k}">${c.html}</button>`).join('')}</div>`;
    if($('#rep'))$('#rep').onclick=()=>Q.ask&&Q.ask();
    $$('.opt').forEach(b=>b.onclick=()=>{if(lock)return;const c=Q.choices[+b.dataset.k];if(o.rec)o.rec(c.ok,Q);
      if(c.ok){lock=true;if(!tried){score++;addStar();}b.classList.add('good');good();if(Q.after)Q.after();T(next,Q.delay||1300);}
      else{tried=true;b.classList.add('wrong');bad();}});
    if(Q.ask)T(Q.ask,350);
  };next();
}
function game_listen(n,tag){
  n=n||10;const id=tag||'listen';
  quiz({n,id,title:tag?'🔁 مراجعة':'اسمع واختر 👂',make:()=>{
    const t=pickLetter();const o=shuffle([t,...shuffle(LETTERS.filter(l=>l!==t)).slice(0,3)]);
    return{head:`<p class="q">اسمع الحرف ثمّ اختره</p><button class="bigplay" id="rep">🔊</button>`,choices:o.map(l=>({html:l.c,ok:l===t,cls:'ar'})),ask:()=>say(t.n),L:t};
  },rec:(ok,Q)=>rec(id,ok,Q.L.c)});
}
function letterTiles(o){
  setTitle(o.title);let round=0,score=0;
  const next=()=>{
    if(round>=o.n)return finish(o.id,score,o.n);round++;
    const w=pick(o.pool),letters=Array.from(strip(w[0]));let pos=0,err=false;
    let tiles=letters.slice();
    if(o.distract){const ex=new Set();letters.forEach(c=>(SIM[c]||'').split('').forEach(x=>{if(x&&!letters.includes(x))ex.add(x);}));
      shuffle([...ex]).slice(0,3).forEach(x=>tiles.push(x));let g=0;while(tiles.length<letters.length+2&&g++<50){const r=pick(LETTERS).c;if(!tiles.includes(r))tiles.push(r);}}
    app.innerHTML=`${progDots(round,o.n)}<div class="card center">
    <div class="em big" id="pic" style="${o.distract?'visibility:hidden':''}">${w[1]}</div>
    <div class="row"><button class="mini" id="rep">🔊 اسمع الكلمة</button>${o.distract?'<button class="mini" id="hn">💡 مساعدة</button>':''}</div>
    <div class="slots ar">${letters.map(()=>'<span class="slot">؟</span>').join('')}</div><div class="built ar" id="built"></div></div>
    <div class="tiles">${shuffle(tiles).map(c=>`<button class="tl ar" data-c="${c}">${c}</button>`).join('')}</div>`;
    $('#rep').onclick=()=>say(w[0]);if($('#hn'))$('#hn').onclick=()=>{$('#pic').style.visibility='visible';};
    const slots=$$('.slot');
    $$('.tl').forEach(b=>b.onclick=()=>{
      if(pos>=letters.length)return;
      const L=LETTERS.find(l=>l.c===letters[pos]);
      if(b.dataset.c===letters[pos]){b.classList.add('used');slots[pos].textContent=b.dataset.c;slots[pos].classList.add('f');pos++;tone(520+pos*60,.12);
        $('#built').textContent=letters.slice(0,pos).join('');if(L)rec(o.id,true,L.c);
        if(pos===letters.length){$('#built').textContent=w[0];$('#pic').style.visibility='visible';if(!err){score++;addStar();}good();say(w[0]);T(next,1900);}}
      else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);bad();err=true;if(L)rec(o.id,false,L.c);}
    });
    T(()=>say(w[0]),350);
  };next();
}
const SHORT=()=>POOL.filter(x=>{const n=Array.from(strip(x[0])).length;return n>=2&&n<=5;});
function game_build(){letterTiles({id:'build',title:'ركّب الكلمة 🧩',n:6,distract:false,pool:SHORT()});}
function game_dictation(){letterTiles({id:'dictation',title:'الإملاء ✍️',n:6,distract:true,pool:SHORT()});}
function game_bubbles(){
  setTitle('صيد الحروف 🎈');const target=pickLetter();let score=0,time=40;
  app.innerHTML=`<div class="card bh"><div>اصطد: <span class="ar tgt">${target.c}</span> <button class="mini" id="rep">🔊</button></div><div>⏱️ <b id="tm">40</b>&nbsp; ✅ <b id="sc">0</b></div></div><div id="sky"></div>`;
  $('#rep').onclick=()=>say(target.n);say('اُصْطَدْ حَرْفَ '+target.n);
  const sky=$('#sky');
  I(()=>{const L=Math.random()<.4?target:pick(LETTERS);const b=document.createElement('button');b.className='bub ar';b.textContent=L.c;
    b.style.left=(4+Math.random()*72)+'%';b.style.animationDuration=(5+Math.random()*3)+'s';b.style.background=pick(BUBC);
    b.onpointerdown=()=>{if(b.dataset.d)return;b.dataset.d=1;if(L.c===target.c){score++;$('#sc').textContent=score;tone(700,.12);b.classList.add('pop');rec('bubbles',true,target.c);}else{bad();b.classList.add('nope');rec('bubbles',false,target.c);}setTimeout(()=>b.remove(),300);};
    b.addEventListener('animationend',()=>b.remove());sky.appendChild(b);},750);
  I(()=>{time--;$('#tm').textContent=time;if(time<=0){addStar(Math.min(10,Math.ceil(score/2)));finish('bubbles',score,null,'اصطدت '+score+' حرفًا 🎈');}},1000);
}
function game_memory(){
  setTitle('لعبة الذاكرة 🧠');
  const words=shuffle(POOL).slice(0,6);const cards=shuffle(words.flatMap((w,i)=>[{k:i,t:'em',v:w[1]},{k:i,t:'ar',v:w[0]}]));
  let open=[],found=0,moves=0,lock=false;
  app.innerHTML=`<div class="card center">طابق الصورة مع الكلمة — المحاولات: <b id="mv">0</b></div>
  <div class="mem">${cards.map((c,i)=>`<button class="mc" data-i="${i}"><span class="front ${c.t}">${c.v}</span><span class="back">❓</span></button>`).join('')}</div>`;
  $$('.mc').forEach(b=>b.onclick=()=>{
    const c=cards[+b.dataset.i];if(lock||b.classList.contains('open'))return;
    b.classList.add('open');say(words[c.k][0]);open.push([b,c]);
    if(open.length===2){moves++;$('#mv').textContent=moves;const[a,d]=open;open=[];
      if(a[1].k===d[1].k){a[0].classList.add('done');d[0].classList.add('done');found++;good();addStar();rec('memory',true);
        if(found===6)T(()=>finish('memory',6,6,'أنهيت اللعبة في '+moves+' محاولة 🧠'),1200);}
      else{lock=true;rec('memory',false);T(()=>{a[0].classList.remove('open');d[0].classList.remove('open');lock=false;},1100);}}
  });
}
function game_where(){
  const POS=['في أوّل الكلمة','في وسط الكلمة','في آخر الكلمة'];
  quiz({n:8,id:'where',title:'أين الحرف؟ 🔍',make:()=>{
    let w,L,ps;
    for(let t=0;t<200;t++){w=pick(POOL);const b=Array.from(strip(w[0]));if(b.length<3)continue;const idx=Math.floor(Math.random()*b.length);const c=b[idx];L=LETTERS.find(l=>l.c===c);if(!L||b.filter(x=>x===c).length>1){L=null;continue;}ps=idx===0?0:idx===b.length-1?2:1;break;}
    if(!L){w=['قَلَم','✏️'];L=LETTERS[20];ps=0;}
    return{head:`<div class="em big">${w[1]}</div><div class="rword ar">${w[0]}</div><p class="q">أين حرف <span class="ar tgt">${L.c}</span> ؟ <button class="mini" id="rep">🔊</button></p>`,
      cls:'one',choices:POS.map((p,k)=>({html:p,ok:k===ps,cls:'txt'})),ask:()=>say('أَيْنَ حَرْفُ '+L.n+' فِي كَلِمَةِ '+w[0]),L};
  },rec:(ok,Q)=>rec('where',ok,Q.L.c)});
}
function game_count(){
  quiz({n:8,id:'count',title:'لعبة العدّ 🔢',make:()=>{
    const n=1+Math.floor(Math.random()*10),em=pick(COUNT_EM);
    const set=new Set([n]);while(set.size<3){set.add(Math.max(1,Math.min(12,n+pick([-2,-1,1,2,3]))));}
    return{head:`<p class="q">كم عددها؟ <button class="mini" id="rep">🔊</button></p><div class="countbox">${em.repeat(n)}</div>`,cls:'three',
      choices:shuffle([...set]).map(x=>({html:`${x}<small class="ar" style="display:block;font-size:16px">${NUMS[x-1]}</small>`,ok:x===n,cls:'wd'})),
      ask:()=>say('كَمْ عَدَدُهَا؟'),after:()=>say(NUMS[n-1])};
  },rec:ok=>rec('count',ok)});
}
function game_sunmoon(){
  const pool=POOL.filter(w=>{const c=w[0][0];return c!=='ا'&&LETTERS.some(l=>l.c===c||c==='أ')&&!w[0].includes(' ');});
  setTitle('شمسيّة أم قمريّة؟ ☀️🌙');let round=0,score=0;const N=8;
  const next=()=>{
    if(round>=N)return finish('sunmoon',score,N);round++;
    const w=pick(pool),isSun=SUN.includes(w[0][0]),al=alWord(w[0]);let tried=false,lock=false;
    app.innerHTML=`${progDots(round,N)}<div class="card center"><div class="em big">${w[1]}</div><div class="rword ar">${al}</div><div><button class="mini" id="rep">🔊</button></div><p class="q">هل اللام شمسيّة أم قمريّة؟</p></div>
    <div class="two-btn"><button class="opt sun" data-s="1"><span>☀️</span>شمسيّة</button><button class="opt moon" data-s="0"><span>🌙</span>قمريّة</button></div><div class="center mut" id="ex" style="margin-top:12px;font-size:17px"></div>`;
    $('#rep').onclick=()=>say(al);
    $$('.opt').forEach(b=>b.onclick=()=>{if(lock)return;const ok=(b.dataset.s==='1')===isSun;rec('sunmoon',ok);
      if(ok){lock=true;if(!tried){score++;addStar();}b.classList.add('good');good();$('#ex').textContent=isSun?'☀️ اللام لا تُقرأ، والحرف «'+w[0][0]+'» مشدّد':'🌙 اللام تُقرأ ساكنة';say(al);T(next,2000);}
      else{tried=true;b.classList.add('wrong');bad();}});
    T(()=>say(al),350);
  };next();
}
function game_join(){
  const pool=POOL.filter(x=>{const n=Array.from(strip(x[0])).length;return n>=3&&n<=5;});
  quiz({n:8,id:'join',title:'وصل الحروف 🔗',make:()=>{
    const w=pick(pool),ls=Array.from(strip(w[0]));const right=ls.join('');
    const set=new Set([right]);const rev=ls.slice().reverse().join('');if(rev!==right)set.add(rev);
    let g=0;while(set.size<3&&g++<50){const s=strip(pick(pool)[0]);if(Array.from(s).length===ls.length)set.add(s);}
    while(set.size<3)set.add(shuffle(ls).join('')+(set.size));
    return{head:`<p class="q">إذا وصلنا هذه الحروف، ماذا نكتب؟</p><div class="sep ar">${ls.map(c=>`<span>${c}</span>`).join('<i>+</i>')}</div>`,cls:'one',
      choices:shuffle([...set]).map(s=>({html:s,ok:s===right,cls:'ar wd'})),after:()=>say(w[0]),delay:1500};
  },rec:ok=>rec('join',ok)});
}
function game_opposites(){
  quiz({n:8,id:'opposites',title:'الأضداد ↔️',make:()=>{
    const o=pick(OPP),flip=Math.random()<.5;const a=flip?[o[2],o[3]]:[o[0],o[1]],b=flip?[o[0],o[1]]:[o[2],o[3]];
    const others=shuffle(OPP.filter(x=>x!==o)).slice(0,2).map(x=>Math.random()<.5?[x[0],x[1]]:[x[2],x[3]]);
    return{head:`<p class="q">ما عكس هذه الكلمة؟ <button class="mini" id="rep">🔊</button></p><div class="em big">${a[1]}</div><div class="rword ar">${a[0]}</div>`,cls:'three',
      choices:shuffle([{w:b,ok:true},...others.map(w=>({w,ok:false}))]).map(c=>({html:`<small>${c.w[1]}</small>${c.w[0]}`,ok:c.ok,cls:'ar wd'})),
      ask:()=>say(a[0]),after:()=>say(a[0]+'، '+b[0])};
  },rec:ok=>rec('opposites',ok)});
}
function game_plural(){
  quiz({n:8,id:'plural',title:'المفرد والجمع 👨‍👩‍👧',make:()=>{
    const o=pick(PLUR);const others=shuffle(PLUR.filter(x=>x!==o)).slice(0,2).map(x=>x[1]);
    return{head:`<p class="q">ما جمع هذه الكلمة؟ <button class="mini" id="rep">🔊</button></p><div class="em big">${o[2]}</div><div class="rword ar">${o[0]}</div>`,cls:'one',
      choices:shuffle([{w:o[1],ok:true},...others.map(w=>({w,ok:false}))]).map(c=>({html:c.w,ok:c.ok,cls:'ar wd'})),
      ask:()=>say(o[0]),after:()=>say(o[0]+'، '+o[1])};
  },rec:ok=>rec('plural',ok)});
}

/* ===== القرآن ===== */
const pad3=n=>String(n).padStart(3,'0');
function scrQuran(){
  setTitle('السور القصيرة 📖');const p=P();
  app.innerHTML=`<div class="card qnote">التلاوة بصوت الشيخ محمود خليل الحصري (المصحف المعلّم، رواية حفص).<br>تحتاج إلى اتّصال بالإنترنت.</div>`+
  QURAN.map((s,i)=>`<button class="pcard" onclick="go(scrSurah,${i},1)"><span class="em2">📖</span><span class="ar" style="font-size:24px">سورة ${s.t}</span><span style="margin-inline-start:auto">${p.quran[s.n]?'✅':'🎧'}</span></button>`).join('');
}
function scrSurah(i,rep){
  rep=rep||1;const S=QURAN[i];setTitle('سورة '+S.t);const basm=S.n!==1;
  app.innerHTML=`<div class="card">${basm?`<div class="basm ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`:''}
  ${S.a.map((a,k)=>`<div class="ayah ar" data-k="${k}">${a}<span class="num">${k+1}</span></div>`).join('')}</div>
  <div class="card"><h3>🔁 تكرار كلّ آية (للحفظ)</h3><div class="seg">${[1,3,5].map(r=>`<button data-r="${r}" class="${r===rep?'on':''}">${r} ${r===1?'مرّة':'مرّات'}</button>`).join('')}</div></div>
  <div class="row"><button class="btn big ok" id="pl">▶️ استمع إلى السورة</button><button class="btn ghost" id="st">⏹️ توقّف</button></div>
  <p class="qnote">اضغط على أيّ آية لسماعها وحدها.</p>`;
  $$('.seg button').forEach(b=>b.onclick=()=>swap(scrSurah,i,+b.dataset.r));
  const url=a=>QURAN_BASE+pad3(S.n)+pad3(a)+'.mp3';
  const hl=k=>$$('.ayah').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
  const fail=()=>toast('تعذّر تشغيل التلاوة. تأكّد من الاتّصال بالإنترنت 🌐');
  $$('.ayah').forEach(el=>el.onclick=async()=>{const id=++runId;const k=+el.dataset.k;hl(k);
    for(let r=0;r<rep;r++){if(id!==runId)return;if(!await playUrl(url(k+1))){fail();break;}}if(id===runId)hl(-1);});
  $('#pl').onclick=async()=>{
    const id=++runId;hush();
    if(basm){if(!await playUrl(QURAN_BASE+'001001.mp3')){fail();return;}}
    for(let k=0;k<S.a.length;k++){
      for(let r=0;r<rep;r++){if(id!==runId)return;hl(k);const el=$$('.ayah')[k];if(el&&r===0)el.scrollIntoView({block:'center',behavior:'smooth'});
        if(!await playUrl(url(k+1))){fail();hl(-1);return;}if(r<rep-1)await wait(500);}
    }
    if(id!==runId)return;hl(-1);const p=P();if(!p.quran[S.n]){p.quran[S.n]=1;save();addStar(3);}toast('بارك الله فيك 🌟');
  };
  $('#st').onclick=()=>{runId++;stopAudio();hl(-1);};
}
function scrDuas(){
  setTitle('أدعية وآداب 🤲');
  app.innerHTML=`<div class="sec">🤲 أدعية يوميّة</div>`+DUAS.map((d,i)=>`<div class="card"><div style="display:flex;align-items:center;gap:10px"><span class="em2">${d.e}</span><b style="font-size:17px">${d.t}</b><button class="mini" style="margin-inline-start:auto" data-d="${i}">🔊</button></div><div class="ar" style="font-size:26px;line-height:1.9;margin-top:8px;color:var(--p)">${d.d}</div></div>`).join('')+
  `<div class="sec">🌷 آدابي</div><div class="card">${ADAB.map((a,i)=>`<button class="pcard" style="box-shadow:none;background:#FFF8EC;margin-bottom:8px" data-a="${i}"><span class="em2">${a[1]}</span><span class="ar" style="font-size:21px">${a[0]}</span></button>`).join('')}</div>`;
  $$('[data-d]').forEach(b=>b.onclick=()=>say(DUAS[+b.dataset.d].d,0.7));
  $$('[data-a]').forEach(b=>b.onclick=()=>say(ADAB[+b.dataset.a][0]));
}
function scrCerts(){
  setTitle('شهاداتي 🎓');const p=P();
  app.innerHTML=`<div class="card center mut">أكمل المهامّ لتحصل على الشهادات. كلّ شهادة = 10 ⭐</div>
  <div class="badges">${CERTS.map((c,i)=>{const got=p.certs[c.id];return `<button class="badge ${got?'got':'lock'}" data-i="${i}"><span class="em">${got?c.e:'🔒'}</span><b>${c.t}</b><small>${c.d}</small>${got?`<small>📅 ${got}</small>`:''}</button>`;}).join('')}</div>`;

function scrGate(){
  setTitle('ركن الوالدين 🔒');const a=3+Math.floor(Math.random()*7),b=3+Math.floor(Math.random()*7);
  app.innerHTML=`<div class="card center"><div class="huge">🔒</div><h3>هذا الركن للوالدين</h3><p style="font-size:22px">كم يساوي ${a} × ${b} ؟</p>
  <input type="number" id="ans" inputmode="numeric"><div class="row"><button class="btn big" id="go">دخول</button></div></div>`;
  $('#go').onclick=()=>{if(+$('#ans').value===a*b)swap(scrParents);else{bad();toast('إجابة غير صحيحة');}};

function voiceDiag(){
  const eng={android:'محرّك الهاتف ✅',web:'المتصفّح',none:'غير متوفّر ❌'}[VS.engine];
  const ar=VS.arabic===true?'مثبّت ✅':VS.arabic===false?'غير مثبّت ❌':'جارٍ الفحص…';
  return `<div class="diag">المحرّك: <b>${eng}</b><br>الصوت العربيّ: <b>${ar}</b>${VS.voiceName?`<br>المحرّك المستعمل: <b dir="ltr">${esc(VS.voiceName)}</b>`:''}${VS.err?`<br>آخر خطأ: <b dir="ltr">${esc(VS.err)}</b>`:''}</div>`;
}
function scrParents(){
  const p=P();setTitle('لوحة الوالدين 📊');
  const learned=Object.keys(p.learned).length,read=Object.keys(p.read).length,st=Object.keys(p.stories).length;
  const days=[];const DN=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push([DN[d.getDay()],Math.round((p.secs[dkey(d)]||0)/60),(p.daily[dkey(d)]||{}).all]);}
  const mx=Math.max(5,...days.map(d=>d[1]));const week=days.reduce((a,d)=>a+d[1],0);
  const weak=LETTERS.map(l=>{const e=p.err[l.c]||0,o=p.ok[l.c]||0;return{l,e,r:e/(e+o||1)};}).filter(x=>x.e>=2).sort((a,b)=>b.r-a.r).slice(0,6);
  const gname=Object.fromEntries(GAMES.map(g=>[g.id,g.e+' '+g.n]));gname.story='📚 أسئلة القصص';gname.review='🔁 مراجعة';
  const grow=Object.entries(p.games).map(([k,g])=>`<tr><td>${gname[k]||k}</td><td>${g.played||0}</td><td>${g.t?Math.round(g.c/g.t*100)+'%':'—'}</td></tr>`).join('');
  app.innerHTML=`
  <div class="card hello"><div class="av">${p.avatar}</div><div><div class="hi">${esc(p.name)}</div><div class="mut">⭐ ${p.stars} — 🌈 ${streak()} أيّام — 🎓 ${Object.keys(p.certs).length} شهادات</div></div></div>
  <div class="card"><h3>🔊 الصوت</h3><div id="vd">${voiceDiag()}</div>
  <div class="row"><button class="btn" id="tst">🔊 تجربة الصوت</button><button class="btn ghost" id="inst">⬇️ تثبيت الصوت العربيّ</button></div>
  <h3 style="margin-top:10px">سرعة القراءة</h3><div class="seg">${[[0.6,'بطيء'],[0.8,'عادي'],[1,'سريع']].map(r=>`<button data-r="${r[0]}" class="${DB.rate==r[0]?'on':''}">${r[1]}</button>`).join('')}</div>
  <p class="mut" style="font-size:13px;line-height:1.8">إن لم تسمع شيئًا: ارفع <b>صوت الوسائط</b> 🔊، ثمّ: الإعدادات ← تحويل النصّ إلى كلام ← المحرّك: <b>Google</b> ← ⚙️ ← تثبيت بيانات الصوت ← <b>العربيّة</b>.</p></div>
  <div class="card"><h3>التقدّم</h3><div class="stat"><div><b>${learned}/28</b><small>حروف</small></div><div><b>${read}/${READ.length}</b><small>كلمات مقروءة</small></div><div><b>${st}/${STORIES.length}</b><small>قصص</small></div>
  <div><b>${Object.keys(p.said).length}/${ALL_PHRASES.length}</b><small>عبارات</small></div><div><b>${Object.keys(p.quran).length}/${QURAN.length}</b><small>سور</small></div><div><b>${p.best||0}</b><small>أفضل سلسلة</small></div></div></div>
  <div class="card"><h3>وقت التعلّم (آخر 7 أيّام): ${week} دقيقة</h3><div class="chart">${days.map(d=>`<div><span>${d[1]}${d[2]?' ✅':''}</span><i style="height:${d[1]/mx*80}%"></i>${d[0]}</div>`).join('')}</div></div>
  <div class="card"><h3>حروف تحتاج إلى مراجعة</h3>${weak.length?`<div class="weak">${weak.map(x=>`<span class="ar">${x.l.c}</span>`).join('')}</div>`:'<p class="mut">لا توجد حروف صعبة حاليًّا 👍</p>'}</div>
  <div class="card"><h3>الألعاب</h3>${grow?`<table><tr><th>اللعبة</th><th>مرّات</th><th>الدقّة</th></tr>${grow}</table>`:'<p class="mut">لم يلعب بعد.</p>'}</div>
  <div class="card"><h3>الأطفال</h3><div class="row"><button class="btn" id="sw">🔄 تغيير الطفل</button><button class="btn ghost" id="add">➕ إضافة طفل</button></div>
  <div class="row"><button class="btn ghost" id="rst">♻️ تصفير التقدّم</button><button class="btn red" id="del">🗑️ حذف</button></div></div>`;
  const refresh=()=>{const v=$('#vd');if(v)v.innerHTML=voiceDiag();};
  $$('.seg button').forEach(b=>b.onclick=()=>{DB.rate=+b.dataset.r;save();$$('.seg button').forEach(x=>x.classList.toggle('on',x===b));say('مَرْحَبًا بِكُمْ فِي بُسْتَانِ الْحُرُوفِ').then(refresh);});
  $('#tst').onclick=()=>{say('مَرْحَبًا بِكُمْ فِي بُسْتَانِ الْحُرُوفِ').then(refresh);setTimeout(refresh,1500);};
  $('#inst').onclick=openVoiceInstall;
  $('#sw').onclick=()=>replaceRoot(scrProfiles);
  $('#add').onclick=()=>go(scrAddChild);
  $('#rst').onclick=()=>{if(confirm('هل تريد تصفير كلّ تقدّم '+p.name+'؟')){Object.assign(p,JSON.parse(JSON.stringify(DEF)));save();render();toast('تمّ التصفير');}};
  $('#del').onclick=()=>{if(confirm('حذف ملفّ '+p.name+' نهائيًّا؟')){DB.profiles=DB.profiles.filter(x=>x.id!==p.id);DB.current=DB.profiles[0]?DB.profiles[0].id:null;save();replaceRoot(DB.profiles.length?scrProfiles:scrAddChild);}};
}
function start(){
  if(!DB.profiles.length)replaceRoot(scrAddChild);
  else if(!P())replaceRoot(scrProfiles);
  else replaceRoot(scrHome);
}
start();
setTimeout(()=>$('#splash').classList.add('hide'),1800);
setTimeout(()=>{const s=$('#splash');if(s)s.remove();initVoice();},2500);
</script>
